version: '3.9'

services:

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragbot_db
      POSTGRES_USER: ragbot
      POSTGRES_PASSWORD: ragbot_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragbot -d ragbot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ragbot_db
      DB_USER: ragbot
      DB_PASSWORD: ragbot_pass
      DEBUG: "true"
      BASE_URL: http://localhost
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media_data:
